# Purpose: Defines the standalone Praxis configuration, Deployment, and
# Service for the separate IPP-to-Praxis transition/rollback tenant.
#
# Scope: Kind E2E fixture only. This is not a production deployment manifest.
# This fixture belongs to the transition/rollback qualification, not the main
# routing suite.
#
# Dependencies: Requires the ai-tenant-transition namespace, transition
# routing-overlay ConfigMap, transition-provider-credentials Secret, and the
# provider-a-legacy compatibility Service in maas-system from 00-backends.yaml.
#
# Qualification role: Provides the Praxis side of the annotation-absent
# transition path while IPP ownership and rollback are evaluated separately.
# The credential is a dummy test value and must never be treated as a
# production secret.

apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-config
  namespace: ai-tenant-transition
data:
  config.yaml: |
    listeners:
      - name: proxy
        address: "0.0.0.0:8080"
        filter_chains: [main]
    filter_chains:
      - name: main
        filters:
          - filter: json_body_field
            field: model
            header: X-Model
          - filter: intelligent_route
            overlay_file: /etc/praxis/routing/routing-overlay.json
            model_header: X-Model
            reload: {enabled: true, debounce_ms: 500}
          - filter: credential_inject
            credentials:
              - name: transition-provider-credentials
                namespace: ai-tenant-transition
                key: api-key
                file: /etc/praxis/credentials/transition-provider-credentials/api-key
          - filter: load_balancer
            clusters:
              - name: provider-transition-provider
                endpoints: ["provider-a.maas-system.svc.cluster.local:8000"]
    admin: {address: "127.0.0.1:9901"}
    insecure_options: {allow_private_endpoints: true}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis
  namespace: ai-tenant-transition
spec:
  replicas: 1
  selector: {matchLabels: {app: praxis-transition}}
  template:
    metadata: {labels: {app: praxis-transition}}
    spec:
      containers:
      - name: praxis
        image: praxis-ai:overlay-e2e
        imagePullPolicy: Never
        command: [praxis-ai]
        args: [-c, /etc/praxis/config.yaml]
        ports: [{name: http, containerPort: 8080}, {name: admin, containerPort: 9901}]
        volumeMounts:
        - {name: config, mountPath: /etc/praxis/config.yaml, subPath: config.yaml, readOnly: true}
        - {name: routing, mountPath: /etc/praxis/routing, readOnly: true}
        - {name: credentials, mountPath: /etc/praxis/credentials, readOnly: true}
      volumes:
      - {name: config, configMap: {name: praxis-config}}
      - {name: routing, configMap: {name: routing-overlay}}
      - name: credentials
        secret:
          secretName: transition-provider-credentials
          items:
          - key: api-key
            path: transition-provider-credentials/api-key
---
apiVersion: v1
kind: Service
metadata:
  name: praxis
  namespace: ai-tenant-transition
spec:
  selector: {app: praxis-transition}
  ports:
  - {name: http, port: 8080, targetPort: http}
  - {name: admin, port: 9901, targetPort: admin}
