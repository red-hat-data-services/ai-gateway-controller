# Purpose: Deploys the Katan provider backends and Services used by the
# models-as-a-service and ai-tenant-tenant-b routing fixtures.
#
# Scope: Kind E2E fixture only. This is not a production deployment manifest.
#
# Dependencies: Requires the maas-system namespace and the pinned public
# llm-katan image loaded into Kind. The provider credentials Secret is tenant-local; these
# backends serve the tenant-local Praxis instances through maas-system.
#
# Qualification role: Supplies independently addressable provider endpoints,
# including the HTTPS transition compatibility Service, for routing,
# attribution, and IPP-to-Praxis transition/rollback checks. Credentials here
# are dummy test values and must never be treated as production secrets.

apiVersion: v1
kind: Secret
metadata:
  name: provider-credentials
  namespace: models-as-a-service
stringData:
  api-key: kind-only-dummy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: katan-a
  namespace: maas-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: katan-a}
  template:
    metadata: {labels: {app: katan-a}}
    spec:
      containers:
      - name: katan
        image: ghcr.io/nerdalert/llm-katan@sha256:11379a1ec2fd69dc121eada6c544eb423a7c074414507dc1d474f4abba9df75a
        imagePullPolicy: Never
        command: [llm-katan]
        args: [--model, demo, --backend, echo, --providers, openai, --validate-keys, --api-keys, openai=kind-only-dummy, --chunk-delay-ms, "250", --ttft-ms, "100", --itl-ms, "250", --tls-cert, /etc/katan/tls/tls.crt, --tls-key, /etc/katan/tls/tls.key]
        ports: [{name: http, containerPort: 8000}]
        volumeMounts: [{name: provider-a-tls, mountPath: /etc/katan/tls, readOnly: true}]
      volumes: [{name: provider-a-tls, secret: {secretName: provider-a-tls}}]
---
apiVersion: v1
kind: Service
metadata: {name: provider-a, namespace: maas-system}
spec:
  selector: {app: katan-a}
  ports: [{name: http, port: 8000, targetPort: http}, {name: https, port: 443, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: provider-a-ext, namespace: maas-system}
spec:
  selector: {app: katan-a}
  ports: [{name: https, port: 443, targetPort: http}]
---
# The existing IPP ExternalModel reconciler always renders HTTPS for its
# external-provider transport. Keep this TLS endpoint run-owned and separate
# from the explicitly plaintext Praxis endpoints above.
apiVersion: v1
kind: Service
metadata:
  name: provider-a-legacy
  namespace: maas-system
  labels:
    app.kubernetes.io/managed-by: local-env
    local-env.opendatahub.io/purpose: ipp-transition-backend
spec:
  selector: {app: katan-transition}
  ports: [{name: https, port: 443, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: katan-transition
  namespace: maas-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: katan-transition}
  template:
    metadata: {labels: {app: katan-transition}}
    spec:
      containers:
      - name: katan
        image: ghcr.io/nerdalert/llm-katan@sha256:11379a1ec2fd69dc121eada6c544eb423a7c074414507dc1d474f4abba9df75a
        imagePullPolicy: Never
        command: [llm-katan]
        args: [--model, demo, --backend, echo, --providers, openai, --validate-keys, --api-keys, openai=transition-provider-key, --tls-cert, /etc/katan/tls/tls.crt, --tls-key, /etc/katan/tls/tls.key]
        ports: [{name: http, containerPort: 8000}]
        volumeMounts: [{name: provider-transition-tls, mountPath: /etc/katan/tls, readOnly: true}]
      volumes: [{name: provider-transition-tls, secret: {secretName: provider-transition-tls}}]
---
