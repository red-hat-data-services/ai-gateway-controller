# Purpose: Adds the MaaS model reference, subscription, and authentication
# policy for the separate IPP-to-Praxis transition/rollback tenant.
#
# Scope: Kind E2E fixture only. This is not a production deployment manifest.
# This fixture belongs to the transition/rollback qualification, not the main
# routing suite.
#
# Dependencies: Requires the transition-model from 42-transition-fixtures.yaml,
# ai-tenant-transition, the MaaS controller, and the generated transition
# HTTPRoute and the transition qualification's authentication path.
#
# Qualification role: Exercises MaaS subscription/authentication state across
# the IPP-to-Praxis transition and rollback boundary. `kind-user` is a
# test-only identity.

apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: transition-model
  namespace: ai-tenant-transition
spec:
  modelRef:
    kind: ExternalModel
    name: transition-model
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: transition-subscription
  namespace: ai-tenant-transition
spec:
  owner:
    users:
      - kind-user
  modelRefs:
    - name: transition-model
      namespace: ai-tenant-transition
      tokenRateLimits:
        - limit: 10000
          window: 1m
  priority: 10
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: transition-access
  namespace: ai-tenant-transition
spec:
  modelRefs:
    - name: transition-model
      namespace: ai-tenant-transition
  subjects:
    users:
      - kind-user
