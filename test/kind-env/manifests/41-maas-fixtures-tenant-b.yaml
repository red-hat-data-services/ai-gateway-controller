# Purpose: Configures tenant-B MaaS model-reference, subscription, and
# authentication-policy resources for `ai-tenant-tenant-b`.
#
# Scope: Kind E2E fixture only. This is not a production deployment manifest.
#
# Dependencies: Requires 21-fixtures-tenant-b.yaml's demo-model, the tenant-B
# namespace, the MaaS API/controller, and its generated HTTPRoute. The route
# policy in 51-route-policies-tenant-b.yaml authenticates the resulting route.
#
# Qualification role: Proves tenant-B subscription and authentication remain
# isolated from tenant A while both use the shared Kind MaaS control plane.
# `kind-user` is a test-only identity.

apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: demo
  namespace: ai-tenant-tenant-b
spec:
  modelRef:
    kind: ExternalModel
    name: demo-model
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: kind-e2e-subscription
  namespace: ai-tenant-tenant-b
spec:
  owner:
    users: [kind-user]
  modelRefs:
  - name: demo
    namespace: ai-tenant-tenant-b
    tokenRateLimits:
    - limit: 10000
      window: 1m
  priority: 10
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: kind-e2e-access
  namespace: ai-tenant-tenant-b
spec:
  modelRefs:
  - name: demo
    namespace: ai-tenant-tenant-b
  subjects:
    users: [kind-user]
