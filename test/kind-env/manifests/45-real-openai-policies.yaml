# Purpose: Defines the Kind-only policies for the opt-in OpenAI qualification.
#
# Scope: Kind E2E resource only. This is not a production deployment manifest.
#
# Dependencies: Requires the shared OpenAI CR chain from
# test/external-model/openai.yaml.tmpl, the existing AITenant, controller,
# Authorino/Kuadrant, and its tenant-local credential Secret.
#
# Qualification role: Keeps Kind authentication and rate limiting separate
# from the shared OpenAI provider/model authorization chain.

apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: openai-e2e-auth
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/managed-by: local-env
spec:
  rules:
    authentication:
      api-key:
        plain:
          selector: request.headers.authorization
    metadata:
      apiKeyValidation:
        http:
          method: POST
          url: https://maas-api.maas-system.svc.cluster.local:8443/internal/v1/api-keys/validate
          contentType: application/json
          body:
            expression: '{"key": request.headers.authorization.replace("Bearer ", "")}'
    authorization:
      valid-api-key:
        patternMatching:
          patterns:
            - operator: eq
              selector: auth.metadata.apiKeyValidation.valid
              value: "true"
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: external-model-openai-gpt-4o-mini
---
apiVersion: kuadrant.io/v1alpha1
kind: TokenRateLimitPolicy
metadata:
  name: openai-e2e-rate-limit
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/managed-by: local-env
spec:
  limits:
    external-model:
      counters:
        - expression: auth.identity.userid
      rates:
        - limit: 10000
          window: 1m
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: external-model-openai-gpt-4o-mini
