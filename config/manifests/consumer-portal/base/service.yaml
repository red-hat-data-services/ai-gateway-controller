apiVersion: v1
kind: Service
metadata:
  name: maas-consumer-portal-auth-proxy
  labels:
    app.kubernetes.io/name: maas-consumer-portal-auth-proxy
    app.kubernetes.io/part-of: maas-consumer-portal
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: maas-consumer-portal-auth-proxy-tls
spec:
  selector:
    app.kubernetes.io/name: maas-consumer-portal-auth-proxy
  ports:
    - name: https
      port: 4180
      targetPort: https
    - name: metrics
      port: 9000
      targetPort: metrics
