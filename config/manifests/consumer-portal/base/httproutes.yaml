apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maas-consumer-portal
  labels:
    app.kubernetes.io/name: maas-consumer-portal
    app.kubernetes.io/part-of: maas-consumer-portal
spec:
  hostnames:
    - CONSUMER_PORTAL_HOSTNAME
  parentRefs:
    - name: CONSUMER_PORTAL_GATEWAY_NAME
      namespace: CONSUMER_PORTAL_GATEWAY_NAMESPACE
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /maas-portal
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /maas-portal/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /maas-portal
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        # Outer defense for headers the portal AuthPolicy does not inject:
        # the route filter runs after the auth mutation, so it must not
        # remove any header the AuthPolicy sets (the four x-maas-*
        # identity headers, x-auth-request-user/-email, and
        # x-forwarded-id-token) — those are overwritten by the policy
        # on success instead.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-auth-request-preferred-username
              - x-auth-request-groups
              - x-auth-request-access-token
              - x-forwarded-user
              - x-forwarded-email
              - x-forwarded-groups
              - x-forwarded-preferred-username
              - x-maas-keyname
              - x-maas-subscription-rate-limit-id
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: no-store
      backendRefs:
        - name: maas-portal
          namespace: CONSUMER_PORTAL_DASHBOARD_NAMESPACE
          port: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maas-consumer-portal-oauth2
  labels:
    app.kubernetes.io/name: maas-consumer-portal-oauth2
    app.kubernetes.io/part-of: maas-consumer-portal
spec:
  hostnames:
    - CONSUMER_PORTAL_HOSTNAME
  parentRefs:
    - name: CONSUMER_PORTAL_GATEWAY_NAME
      namespace: CONSUMER_PORTAL_GATEWAY_NAMESPACE
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2
      backendRefs:
        - name: maas-consumer-portal-auth-proxy
          port: 4180
